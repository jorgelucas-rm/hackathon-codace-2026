services:
  frontend:
    container_name: codace-frontend
    ports:
      - "8080:80"
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    restart: always
    volumes:
      - ./frontend:/app
      # Volume anônimo por cima de /app/node_modules: sem isso, o bind mount
      # acima sobrescreve inteiro o /app do container (inclusive o
      # node_modules instalado no build da imagem) com o conteúdo do host —
      # se o host não tiver rodado `npm install`, o container fica sem
      # dependências. Essa entrada faz o node_modules "vazado" no build da
      # imagem sobreviver por baixo do mount do código-fonte.
      - /app/node_modules

  backend:
    container_name: codace-backend
    ports:
      - "8081:8080"
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: always
    volumes:
      - ./backend:/app

  database:
    container_name: codace-database
    ports:
      - "5432:5432"
    image: postgres:18
    env_file: ./backend/src/environments/.env
    restart: always
    volumes:
      - ./database:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    container_name: codace-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: ./backend/src/environments/.env
    command: >
      server /data
      --address ":9000"
      --console-address ":9001"
    restart: always
    volumes:
      - ./minio:/data

