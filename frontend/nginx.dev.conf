server {
    listen 80;
    server_name _;

    # `react-scripts build` (Create React App) gera em ./build, não ./dist —
    # o path abaixo tem que bater com o que o Dockerfile.dev/entrypoint
    # realmente produz dentro do container.
    root /app/build;
    index index.html;

    # O frontend chama a API com paths relativos (`/api/...`, ver
    # `src/services/*.ts`) — sem esse proxy, todo fetch do app cai em 404
    # (o nginx não tem `/api` nenhum pra servir). `backend` é o nome do
    # serviço no docker-compose (rede interna do compose), porta 8080 é a
    # que o `run.py`/uvicorn expõe (ver `backend/Dockerfile.dev`).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
